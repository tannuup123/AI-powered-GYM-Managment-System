<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage Gyms - Super Admin">
  <title>Manage Gyms - Super Admin</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="stylesheet" href="./src/styles/dashboard.css">
  <link rel="icon" href="./public/logo.png" type="image/png">
</head>
<body>
  <div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="./public/logo.png" alt="Fit Track Pro" class="sidebar-logo">
        <span class="sidebar-brand">Fit Track Pro</span>
      </div>
      
      <nav class="sidebar-nav">
        <div class="nav-section">
          <span class="nav-section-title">Overview</span>
          <a href="./superadmin-dashboard.html" class="nav-link">
            <i class="fa-solid fa-chart-pie"></i>
            <span>Dashboard</span>
          </a>
        </div>
        
        <div class="nav-section">
          <span class="nav-section-title">Management</span>
          <a href="./superadmin-gyms.html" class="nav-link active">
            <i class="fa-solid fa-building"></i>
            <span>Manage Gyms</span>
          </a>
          <a href="./superadmin-users.html" class="nav-link">
            <i class="fa-solid fa-users-cog"></i>
            <span>Manage Users</span>
          </a>
        </div>
        
        <div class="nav-section">
          <span class="nav-section-title">Requests</span>
          <a href="./superadmin-users.html?tab=pending" class="nav-link">
            <i class="fa-solid fa-user-clock"></i>
            <span>Pending Approvals</span>
            <span class="badge badge-warning" id="pendingBadge" style="margin-left: auto; display: none;">0</span>
          </a>
        </div>
      </nav>
      
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="avatar avatar-placeholder" style="background: var(--primary-600); color: white;">SA</div>
          <div class="user-details">
            <div class="user-name" id="adminEmail">Super Admin</div>
            <div class="user-role">System Administrator</div>
          </div>
          <button class="btn btn-ghost btn-icon" id="logoutBtn" title="Logout">
            <i class="fa-solid fa-sign-out-alt"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Mobile Sidebar Toggle -->
    <button class="sidebar-toggle" id="sidebarToggle">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h1>Manage Gyms</h1>
          <p>View and manage all registered fitness centers</p>
        </div>
        <div class="badge badge-primary" id="gymCount">Loading...</div>
      </div>
      
      <!-- Search -->
      <div class="card" style="margin-bottom: var(--space-6);">
        <div style="position: relative;">
          <i class="fa-solid fa-search" style="position: absolute; left: var(--space-4); top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
          <input type="text" id="searchInput" class="form-input" placeholder="Search gyms by name, city, or owner..." style="padding-left: 40px;">
        </div>
      </div>
      
      <!-- Gyms Grid -->
      <div class="gyms-grid" id="gymsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-6);">
        <!-- Gym cards will be injected here -->
        <div style="grid-column: 1/-1; text-align: center; padding: var(--space-8); color: var(--text-muted);">
          <i class="fa-solid fa-spinner fa-spin fa-2x" style="margin-bottom: var(--space-4);"></i>
          <p>Loading gyms...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script type="module">
    import { auth, database } from './src/config/firebase.js';
    import { onAuthStateChanged, signOut } from 'firebase/auth';
    import { ref, get, remove } from 'firebase/database';
    import { showSuccess, showError } from './src/components/toast.js';

    let allGyms = [];

    // DOM Elements
    const gymsGrid = document.getElementById('gymsGrid');
    const searchInput = document.getElementById('searchInput');
    const gymCount = document.getElementById('gymCount');
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const logoutBtn = document.getElementById('logoutBtn');

    // Mobile sidebar toggle
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('active');
    });

    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('active');
    });

    // Check auth
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = './superadmin-login.html';
        return;
      }

      const superadminSnap = await get(ref(database, `superadmins/${user.uid}`));
      if (!superadminSnap.exists()) {
        window.location.href = './login.html';
        return;
      }
      
      const userEmail = user.email || 'Admin';
      document.getElementById('adminEmail').textContent = userEmail;

      loadPendingCount();
      loadGyms();
    });

    // Logout
    logoutBtn.addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = './superadmin-login.html';
    });
    
    // Load pending request for sidebar badge
    async function loadPendingCount() {
       try {
        const requestsSnap = await get(ref(database, 'pending_requests'));
        let pendingCount = 0;
        if (requestsSnap.exists()) {
          requestsSnap.forEach(req => {
            if (req.val().status === 'pending') pendingCount++;
          });
        }
        const badge = document.getElementById('pendingBadge');
        if (pendingCount > 0) {
            badge.textContent = pendingCount;
            badge.style.display = 'inline-flex';
        } else {
            badge.style.display = 'none';
        }
       } catch (e) {}
    }

    // Search
    searchInput.addEventListener('input', renderGyms);

    // Load gyms
    async function loadGyms() {
      try {
        allGyms = [];
        const ownersSnap = await get(ref(database, 'owners'));
        
        if (ownersSnap.exists()) {
          ownersSnap.forEach(snap => {
            const gym = snap.val();
            gym.id = snap.key;
            gym.memberCount = gym.members ? Object.keys(gym.members).length : 0;
            allGyms.push(gym);
          });
        }

        // Count trainers per gym
        const trainersSnap = await get(ref(database, 'trainers'));
        if (trainersSnap.exists()) {
          trainersSnap.forEach(snap => {
            const trainer = snap.val();
            const gym = allGyms.find(g => g.id === trainer.gymId);
            if (gym) {
              gym.trainerCount = (gym.trainerCount || 0) + 1;
            }
          });
        }

        gymCount.textContent = `${allGyms.length} Gyms`;
        renderGyms();
      } catch (error) {
        console.error('Error loading gyms:', error);
        gymsGrid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: var(--space-8); color: var(--error-400);">
            <i class="fa-solid fa-exclamation-triangle fa-2x" style="margin-bottom: var(--space-4);"></i>
            <p>Failed to load gyms</p>
          </div>
        `;
      }
    }

    // Render gyms
    function renderGyms() {
      const query = searchInput.value.toLowerCase();
      let filtered = allGyms;

      if (query) {
        filtered = allGyms.filter(gym => 
          (gym.gymName || '').toLowerCase().includes(query) ||
          (gym.city || '').toLowerCase().includes(query) ||
          (gym.name || '').toLowerCase().includes(query)
        );
      }

      if (filtered.length === 0) {
        gymsGrid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: var(--space-16); color: var(--text-muted); background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border-color);">
            <i class="fa-solid fa-search fa-3x" style="margin-bottom: var(--space-4); opacity: 0.2;"></i>
            <p>${query ? 'No gyms match your search' : 'No gyms registered yet'}</p>
          </div>
        `;
        return;
      }

      gymsGrid.innerHTML = filtered.map(gym => `
        <div class="card" style="padding: 0; overflow: hidden; display: flex; flex-direction: column; height: 100%;">
          <div style="height: 140px; background: linear-gradient(135deg, var(--primary-600), var(--accent-600)); display: flex; align-items: center; justify-content: center; position: relative;">
            ${gym.imageUrl 
              ? `<img src="${gym.imageUrl}" alt="${gym.gymName}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">`
              : ''
            }
            <i class="fa-solid fa-dumbbell" style="font-size: 3rem; color: rgba(255,255,255,0.3); ${gym.imageUrl ? 'display: none;' : ''}"></i>
            
            <div style="position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.5); color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem;">
                <i class="fa-solid fa-location-dot"></i> ${gym.city || 'N/A'}
            </div>
          </div>
          
          <div style="padding: var(--space-5); flex: 1; display: flex; flex-direction: column;">
            <div style="margin-bottom: var(--space-4);">
                <h3 style="font-size: var(--text-lg); margin-bottom: 4px;">${gym.gymName || 'Unnamed Gym'}</h3>
                <p style="color: var(--text-muted); font-size: var(--text-sm);">
                    <i class="fa-solid fa-user-tie" style="margin-right: 6px;"></i> ${gym.name || 'Unknown Owner'}
                </p>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); margin-bottom: var(--space-5);">
                <div style="background: var(--surface-hover); padding: var(--space-3); border-radius: var(--radius-md); text-align: center;">
                    <div style="font-size: var(--text-lg); font-weight: bold; color: var(--primary-400);">${gym.memberCount || 0}</div>
                    <div style="font-size: var(--text-xs); color: var(--text-muted);">Members</div>
                </div>
                <div style="background: var(--surface-hover); padding: var(--space-3); border-radius: var(--radius-md); text-align: center;">
                    <div style="font-size: var(--text-lg); font-weight: bold; color: var(--accent-400);">${gym.trainerCount || 0}</div>
                    <div style="font-size: var(--text-xs); color: var(--text-muted);">Trainers</div>
                </div>
            </div>

            <div style="display: flex; gap: var(--space-2); margin-top: auto;">
              <a href="mailto:${gym.email}" class="btn btn-ghost btn-sm" style="flex: 1;">
                <i class="fa-solid fa-envelope"></i> Contact
              </a>
              <button class="btn btn-ghost btn-sm" style="color: var(--error-400); flex: 1;" onclick="window.deleteGym('${gym.id}', '${gym.gymName}')">
                <i class="fa-solid fa-trash"></i> Delete
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Delete gym (Available globally)
    window.deleteGym = async function(gymId, gymName) {
      if (!confirm(`Are you sure you want to delete "${gymName}"? \n\n⚠️ This will permanently remove all associated members, trainers, and data. This action cannot be undone.`)) return;

      try {
        // Delete associated trainers
        const trainersSnap = await get(ref(database, 'trainers'));
        if (trainersSnap.exists()) {
          const deletePromises = [];
          trainersSnap.forEach(snap => {
            if (snap.val().gymId === gymId) {
              deletePromises.push(remove(ref(database, `trainers/${snap.key}`)));
            }
          });
          await Promise.all(deletePromises);
        }

        // Delete gym (includes members)
        await remove(ref(database, `owners/${gymId}`));
        
        showSuccess(`Gym "${gymName}" has been deleted.`);
        loadGyms();
      } catch (error) {
        console.error('Error deleting gym:', error);
        showError('Failed to delete gym');
      }
    };
  </script>
</body>
</html>
