<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Manage Members</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="owner_dashboard.css" />
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    .member-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 15px;
      text-align: left;
    }
    .member-card input {
      width: 100%;
      padding: 8px;
      margin: 4px 0;
    }
    .actions {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }
    .actions button {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .update-btn {
      background-color: #4CAF50;
      color: white;
    }
    .delete-btn {
      background-color: #f44336;
      color: white;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <header class="dashboard-header">
      <h1>Manage Members</h1>
      <p>Update or Delete Gym Members</p>
    </header>

    <div id="membersContainer"></div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC-oca5z39s7l77EDY_Jx1psRroWtfZ2pM",
      authDomain: "fit-track-be443.firebaseapp.com",
      databaseURL: "https://fit-track-be443-default-rtdb.firebaseio.com",
      projectId: "fit-track-be443",
      storageBucket: "fit-track-be443.appspot.com",
      messagingSenderId: "485684449281",
      appId: "1:485684449281:web:88991ce3596959c0433000"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    const container = document.getElementById("membersContainer");

    auth.onAuthStateChanged(user => {
      if (!user) {
        alert("Please login first.");
        window.location.href = "index.html";
        return;
      }

      const ownerId = user.uid;
      const ref = db.ref(`owners/${ownerId}/members`);

      ref.once("value", snapshot => {
        const data = snapshot.val();
        if (!data) {
          container.innerHTML = "<p>No members found.</p>";
          return;
        }

        Object.entries(data).forEach(([memberId, member]) => {
          const card = document.createElement("div");
          card.className = "member-card";

          card.innerHTML = `
            <label>Name</label>
            <input type="text" value="${member.name}" id="name-${memberId}" />
            <label>Email</label>
            <input type="email" value="${member.email}" id="email-${memberId}" />
            <label>Contact</label>
            <input type="tel" value="${member.contact}" id="contact-${memberId}" />
            <label>Plan</label>
            <input type="text" value="${member.plan}" id="plan-${memberId}" />

            <div class="actions">
              <button class="update-btn" onclick="updateMember('${ownerId}', '${memberId}')">Update</button>
              <button class="delete-btn" onclick="deleteMember('${ownerId}', '${memberId}')">Delete</button>
            </div>
          `;

          container.appendChild(card);
        });
      });
    });

    function updateMember(ownerId, memberId) {
      const name = document.getElementById(`name-${memberId}`).value.trim();
      const email = document.getElementById(`email-${memberId}`).value.trim();
      const contact = document.getElementById(`contact-${memberId}`).value.trim();
      const plan = document.getElementById(`plan-${memberId}`).value.trim();

      firebase.database().ref(`owners/${ownerId}/members/${memberId}`).update({
        name,
        email,
        contact,
        plan
      }).then(() => {
        alert("Member updated successfully!");
      }).catch(err => {
        alert("Error updating member: " + err.message);
      });
    }

    function deleteMember(ownerId, memberId) {
      if (confirm("Are you sure you want to delete this member?")) {
        firebase.database().ref(`owners/${ownerId}/members/${memberId}`).remove()
          .then(() => {
            alert("Member deleted!");
            location.reload();
          })
          .catch(err => {
            alert("Error deleting member: " + err.message);
          });
      }
    }
  </script>
</body>
</html>
