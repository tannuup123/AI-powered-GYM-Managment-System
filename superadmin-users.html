<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage Users - Super Admin">
  <title>Manage Users - Super Admin</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="stylesheet" href="./src/styles/dashboard.css">
  <link rel="icon" href="./public/logo.png" type="image/png">
  
  <style>
    /* Table specific styles that might not be in dashboard.css yet */
    .filter-tabs {
      display: flex;
      gap: var(--space-2);
      margin-bottom: var(--space-6);
      flex-wrap: wrap;
    }
    
    .filter-tab {
      padding: var(--space-2) var(--space-4);
      background: var(--surface-hover);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    
    .filter-tab.active {
      background: var(--primary-600);
      border-color: var(--primary-500);
      color: white;
    }
    
    .filter-tab:hover:not(.active) {
      border-color: var(--primary-400);
      color: var(--text-primary);
    }
    
    .filter-tab .count {
      background: rgba(255,255,255,0.2);
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
    }
    
    .users-table {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      overflow: hidden;
    }
    
    .table-scroll {
      overflow-x: auto;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    
    thead {
      background: rgba(255,255,255,0.03);
    }
    
    th {
      text-align: left;
      padding: var(--space-4);
      font-weight: var(--font-semibold);
      color: var(--text-muted);
      font-size: var(--text-sm);
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-color);
    }
    
    td {
      padding: var(--space-4);
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }
    
    tr:last-child td {
      border-bottom: none;
    }
    
    tr:hover {
      background: rgba(255,255,255,0.02);
    }
    
    .user-cell {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-600), var(--accent-600));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: var(--font-bold);
    }
    
    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: var(--font-medium);
      text-transform: uppercase;
    }
    
    .role-badge.owner { background: rgba(139, 92, 246, 0.1); color: #a78bfa; }
    .role-badge.trainer { background: rgba(16, 185, 129, 0.1); color: var(--success-400); }
    .role-badge.member { background: rgba(59, 130, 246, 0.1); color: #60a5fa; }
    .role-badge.pending { background: rgba(245, 158, 11, 0.1); color: #fbbf24; }
    
    .status-badge {
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
    }
    
    .status-badge.approved { background: rgba(16, 185, 129, 0.1); color: var(--success-400); }
    .status-badge.pending { background: rgba(245, 158, 11, 0.1); color: #fbbf24; }
    .status-badge.rejected { background: rgba(239, 68, 68, 0.1); color: var(--error-400); }
    
    .action-btns {
      display: flex;
      gap: var(--space-2);
    }
    
    .action-btns button {
      padding: var(--space-2);
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .action-btns button:hover {
      border-color: var(--primary-400);
      color: var(--primary-400);
    }
    
    .action-btns button.approve:hover {
      border-color: var(--success-400);
      background: rgba(16, 185, 129, 0.1);
      color: var(--success-400);
    }
    
    .action-btns button.reject:hover {
      border-color: var(--error-400);
      background: rgba(239, 68, 68, 0.1);
      color: var(--error-400);
    }
    
    @media (max-width: 768px) {
      .table-header-hidden-mobile {
        display: none;
      }
      td {
        display: block;
        width: 100%;
        text-align: right;
        padding: var(--space-2) var(--space-4);
        border: none;
      }
      td::before {
        content: attr(data-label);
        float: left;
        font-weight: bold;
        color: var(--text-muted);
      }
      td:first-child {
        padding-top: var(--space-4);
      }
      td:last-child {
        padding-bottom: var(--space-4);
        border-bottom: 1px solid var(--border-color);
      }
      .user-cell {
        flex-direction: row-reverse;
        justify-content: flex-end;
      }
      .action-btns {
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="./public/logo.png" alt="Fit Track Pro" class="sidebar-logo">
        <span class="sidebar-brand">Fit Track Pro</span>
      </div>
      
      <nav class="sidebar-nav">
        <div class="nav-section">
          <span class="nav-section-title">Overview</span>
          <a href="./superadmin-dashboard.html" class="nav-link">
            <i class="fa-solid fa-chart-pie"></i>
            <span>Dashboard</span>
          </a>
        </div>
        
        <div class="nav-section">
          <span class="nav-section-title">Management</span>
          <a href="./superadmin-gyms.html" class="nav-link">
            <i class="fa-solid fa-building"></i>
            <span>Manage Gyms</span>
          </a>
          <a href="./superadmin-users.html" class="nav-link active">
            <i class="fa-solid fa-users-cog"></i>
            <span>Manage Users</span>
          </a>
        </div>
        
        <div class="nav-section">
          <span class="nav-section-title">Requests</span>
          <a href="./superadmin-users.html?tab=pending" class="nav-link" id="pendingLinkSidebar">
            <i class="fa-solid fa-user-clock"></i>
            <span>Pending Approvals</span>
            <span class="badge badge-warning" id="pendingBadge" style="margin-left: auto; display: none;">0</span>
          </a>
        </div>
      </nav>
      
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="avatar avatar-placeholder" style="background: var(--primary-600); color: white;">SA</div>
          <div class="user-details">
            <div class="user-name" id="adminEmail">Super Admin</div>
            <div class="user-role">System Administrator</div>
          </div>
          <button class="btn btn-ghost btn-icon" id="logoutBtn" title="Logout">
            <i class="fa-solid fa-sign-out-alt"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Mobile Sidebar Toggle -->
    <button class="sidebar-toggle" id="sidebarToggle">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <h1>
          <i class="fa-solid fa-users" style="color: var(--primary-400); margin-right: 8px;"></i>
          Manage Users
        </h1>
        <p>Controls all users across the platform</p>
      </div>
      
      <!-- Filter Tabs -->
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">
          <i class="fa-solid fa-users"></i>
          All Users
          <span class="count" id="allCount">0</span>
        </button>
        <button class="filter-tab" data-filter="pending">
          <i class="fa-solid fa-clock"></i>
          Pending
          <span class="count" id="pendingCount">0</span>
        </button>
        <button class="filter-tab" data-filter="owners">
          <i class="fa-solid fa-crown"></i>
          Owners
        </button>
        <button class="filter-tab" data-filter="trainers">
          <i class="fa-solid fa-user-tie"></i>
          Trainers
        </button>
        <button class="filter-tab" data-filter="members">
          <i class="fa-solid fa-user"></i>
          Members
        </button>
      </div>
      
      <!-- Users Table -->
      <div class="users-table">
        <div class="table-scroll">
          <table>
            <thead>
              <tr class="table-header-hidden-mobile">
                <th>User</th>
                <th>Role</th>
                <th>Gym</th>
                <th>Contact</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
              <tr>
                <td colspan="6">
                  <div style="text-align: center; padding: var(--space-8); color: var(--text-muted);">
                    <i class="fa-solid fa-spinner fa-spin fa-2x" style="margin-bottom: var(--space-4);"></i>
                    <p>Loading users...</p>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script type="module">
    import { auth, database } from './src/config/firebase.js';
    import { onAuthStateChanged, signOut } from 'firebase/auth';
    import { ref, get, set, update, remove } from 'firebase/database';
    import { showSuccess, showError } from './src/components/toast.js';

    let allUsers = [];
    let currentFilter = 'all';
    let gymsMap = {};

    // DOM Elements
    const usersTableBody = document.getElementById('usersTableBody');
    const filterTabs = document.querySelectorAll('.filter-tab');
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const logoutBtn = document.getElementById('logoutBtn');

    // Mobile sidebar toggle
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('active');
    });

    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('active');
    });

    // Check auth
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = './superadmin-login.html';
        return;
      }

      const superadminSnap = await get(ref(database, `superadmins/${user.uid}`));
      if (!superadminSnap.exists()) {
        window.location.href = './login.html';
        return;
      }

      const userEmail = user.email || 'Admin';
      document.getElementById('adminEmail').textContent = userEmail;

      // Check URL for tab
      const urlParams = new URLSearchParams(window.location.search);
      const tabParam = urlParams.get('tab');
      if (tabParam === 'pending') {
        currentFilter = 'pending';
        filterTabs.forEach(t => t.classList.remove('active'));
        document.querySelector('[data-filter="pending"]').classList.add('active');
        document.getElementById('pendingLinkSidebar').classList.add('active');
      }

      loadAllUsers();
    });

    // Logout
    logoutBtn.addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = './superadmin-login.html';
    });

    // Filter tabs
    filterTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        filterTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        renderUsers();
      });
    });

    // Load all users
    async function loadAllUsers() {
      try {
        allUsers = [];

        // Load gyms for reference
        const ownersSnap = await get(ref(database, 'owners'));
        if (ownersSnap.exists()) {
          ownersSnap.forEach(snap => {
            const owner = snap.val();
            owner.id = snap.key;
            owner.role = 'owner';
            owner.status = 'approved';
            gymsMap[snap.key] = owner.gymName || 'Unnamed Gym';
            allUsers.push(owner);

            // Get members
            if (owner.members) {
              Object.entries(owner.members).forEach(([memberId, member]) => {
                member.id = memberId;
                member.role = 'member';
                member.gymId = snap.key;
                member.gymName = owner.gymName;
                member.status = member.status || 'approved';
                allUsers.push(member);
              });
            }
          });
        }

        // Load trainers
        const trainersSnap = await get(ref(database, 'trainers'));
        if (trainersSnap.exists()) {
          trainersSnap.forEach(snap => {
            const trainer = snap.val();
            trainer.id = snap.key;
            trainer.role = 'trainer';
            trainer.gymName = gymsMap[trainer.gymId] || 'Unknown Gym';
            trainer.status = trainer.status || 'approved';
            allUsers.push(trainer);
          });
        }

        // Load pending requests
        const requestsSnap = await get(ref(database, 'pending_requests'));
        let pendingCount = 0;
        if (requestsSnap.exists()) {
          requestsSnap.forEach(snap => {
            const req = snap.val();
            req.id = snap.key;
            req.role = req.type;
            // For owner requests, show the proposed gym name
            if (req.type === 'owner' && req.gymData) {
              req.gymName = req.gymData.gymName || 'New Gym';
            } else {
              req.gymName = gymsMap[req.gymId] || 'Unknown Gym';
            }
            req.isPending = req.status === 'pending';
            if (req.isPending) pendingCount++;
            allUsers.push(req);
          });
        }

        // Update counts
        document.getElementById('allCount').textContent = allUsers.length;
        document.getElementById('pendingCount').textContent = pendingCount;
        
        // Update sidebar pending badge
        const badge = document.getElementById('pendingBadge');
        if (pendingCount > 0) {
            badge.textContent = pendingCount;
            badge.style.display = 'inline-flex';
        } else {
            badge.style.display = 'none';
        }

        renderUsers();
      } catch (error) {
        console.error('Error loading users:', error);
        usersTableBody.innerHTML = `
          <tr><td colspan="6">
            <div style="text-align: center; padding: var(--space-8); color: var(--error-400);">
              <i class="fa-solid fa-exclamation-triangle fa-2x" style="margin-bottom: var(--space-4);"></i>
              <p>Failed to load users</p>
            </div>
          </td></tr>
        `;
      }
    }

    // Render users
    function renderUsers() {
      let filtered = [...allUsers];

      if (currentFilter === 'pending') {
        filtered = filtered.filter(u => u.status === 'pending');
      } else if (currentFilter === 'owners') {
        filtered = filtered.filter(u => u.role === 'owner');
      } else if (currentFilter === 'trainers') {
        filtered = filtered.filter(u => u.role === 'trainer' && u.status !== 'pending');
      } else if (currentFilter === 'members') {
        filtered = filtered.filter(u => u.role === 'member' && u.status !== 'pending');
      }

      if (filtered.length === 0) {
        usersTableBody.innerHTML = `
          <tr><td colspan="6">
            <div style="text-align: center; padding: var(--space-16); color: var(--text-muted);">
              <i class="fa-solid fa-users fa-3x" style="margin-bottom: var(--space-4); opacity: 0.2;"></i>
              <p>No ${currentFilter === 'all' ? 'users' : currentFilter} found</p>
            </div>
          </td></tr>
        `;
        return;
      }

      usersTableBody.innerHTML = filtered.map(user => `
        <tr>
          <td data-label="User">
            <div class="user-cell">
              <div class="user-avatar">${(user.name || 'U').charAt(0).toUpperCase()}</div>
              <div>
                <div style="font-weight: var(--font-medium);">${user.name || 'Unknown'}</div>
                <div style="font-size: var(--text-xs); color: var(--text-muted);">${user.email || ''}</div>
              </div>
            </div>
          </td>
          <td data-label="Role">
            <span class="role-badge ${user.role} ${user.status === 'pending' ? 'pending' : ''}">
              <i class="fa-solid ${getRoleIcon(user.role)}"></i>
              ${user.role}
            </span>
          </td>
          <td data-label="Gym">${user.gymName || (user.role === 'owner' ? user.gymName : '-')}</td>
          <td data-label="Contact">
            <div style="font-size: var(--text-sm);">${user.phone || '-'}</div>
          </td>
          <td data-label="Status">
            <span class="status-badge ${user.status || 'approved'}">${user.status || 'Active'}</span>
          </td>
          <td data-label="Actions">
            <div class="action-btns">
              ${user.status === 'pending' ? `
                <button class="approve" onclick="window.approveUser('${user.id}', '${user.role}')" title="Approve">
                  <i class="fa-solid fa-check"></i>
                </button>
                <button class="reject" onclick="window.rejectUser('${user.id}')" title="Reject">
                  <i class="fa-solid fa-times"></i>
                </button>
              ` : `
                <button onclick="window.deleteUser('${user.id}', '${user.role}', '${user.gymId || ''}')" title="Delete">
                  <i class="fa-solid fa-trash"></i>
                </button>
              `}
            </div>
          </td>
        </tr>
      `).join('');
    }

    function getRoleIcon(role) {
      const icons = {
        owner: 'fa-crown',
        trainer: 'fa-user-tie',
        member: 'fa-user'
      };
      return icons[role] || 'fa-user';
    }

    // Approve user (Global)
    window.approveUser = async function(userId, type) {
      const user = allUsers.find(u => u.id === userId);
      if (!user) return;

      try {
        if (type === 'owner') {
          // Create gym owner in owners collection
          await set(ref(database, `owners/${userId}`), {
            name: user.name,
            email: user.email,
            phone: user.phone,
            gymName: user.gymData?.gymName || 'Unnamed Gym',
            description: user.gymData?.description || '',
            city: user.gymData?.city || '',
            pincode: user.gymData?.pincode || '',
            address: user.gymData?.address || '',
            imageUrl: user.gymData?.imageUrl || '',
            facilities: user.gymData?.facilities || {},
            isPublic: true,
            createdAt: user.createdAt,
            approvedAt: new Date().toISOString(),
            role: 'owner',
            status: 'approved'
          });
        } else if (type === 'member') {
          await set(ref(database, `owners/${user.gymId}/members/${userId}`), {
            name: user.name,
            email: user.email,
            phone: user.phone,
            dob: user.profileData?.dob || '',
            gender: user.profileData?.gender || '',
            address: user.profileData?.address || '',
            gymId: user.gymId,
            joiningDate: user.profileData?.joiningDate || new Date().toISOString().split('T')[0],
            createdAt: user.createdAt,
            approvedAt: new Date().toISOString(),
            role: 'member',
            status: 'approved'
          });
        } else if (type === 'trainer') {
          await set(ref(database, `trainers/${userId}`), {
            name: user.name,
            email: user.email,
            phone: user.phone,
            gymId: user.gymId,
            specialization: user.profileData?.specialization || '',
            experience: user.profileData?.experience || 0,
            createdAt: user.createdAt,
            approvedAt: new Date().toISOString(),
            role: 'trainer',
            status: 'approved',
            assignedMembers: {}
          });
        }

        await update(ref(database, `pending_requests/${userId}`), {
          status: 'approved',
          approvedAt: new Date().toISOString()
        });

        showSuccess(`${user.name} approved!`);
        loadAllUsers();
      } catch (error) {
        console.error('Error approving:', error);
        showError('Failed to approve user');
      }
    };

    // Reject user (Global)
    window.rejectUser = async function(userId) {
      if (!confirm('Reject this request?')) return;

      try {
        await update(ref(database, `pending_requests/${userId}`), {
          status: 'rejected',
          rejectedAt: new Date().toISOString()
        });
        showSuccess('Request rejected');
        loadAllUsers();
      } catch (error) {
        showError('Failed to reject');
      }
    };

    // Delete user (Global)
    window.deleteUser = async function(userId, role, gymId) {
      if (!confirm('Are you sure you want to delete this user? \n\n⚠️ This will remove all their data and cannot be undone.')) return;

      try {
        // Delete from main collection based on role
        if (role === 'owner') {
          await remove(ref(database, `owners/${userId}`));
        } else if (role === 'trainer') {
          await remove(ref(database, `trainers/${userId}`));
        } else if (role === 'member' && gymId) {
          await remove(ref(database, `owners/${gymId}/members/${userId}`));
        }
        
        // Also delete from pending_requests if exists
        await remove(ref(database, `pending_requests/${userId}`));
        
        // Also try to delete from members collection (old structure)
        await remove(ref(database, `members/${userId}`));
        
        showSuccess('User deleted successfully!');
        loadAllUsers();
      } catch (error) {
        console.error('Error deleting user:', error);
        showError('Failed to delete user');
      }
    };
  </script>
</body>
</html>
