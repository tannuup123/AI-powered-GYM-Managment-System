<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage Users - Super Admin">
  <title>Manage Users - Super Admin</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="stylesheet" href="./src/styles/dashboard.css">
  <link rel="icon" href="./public/logo.png" type="image/png">
  
  <style>
    .page-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: var(--space-6);
    }
    
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-6);
    }
    
    .page-header h1 {
      font-size: var(--text-2xl);
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    
    .page-header h1 i {
      color: var(--primary-400);
    }
    
    .filter-tabs {
      display: flex;
      gap: var(--space-2);
      margin-bottom: var(--space-6);
      flex-wrap: wrap;
    }
    
    .filter-tab {
      padding: var(--space-2) var(--space-4);
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    
    .filter-tab.active {
      background: var(--primary-600);
      border-color: var(--primary-500);
      color: white;
    }
    
    .filter-tab:hover:not(.active) {
      border-color: var(--primary-400);
      color: var(--text-primary);
    }
    
    .filter-tab .count {
      background: rgba(255,255,255,0.2);
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
    }
    
    .users-table {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      overflow: hidden;
    }
    
    .table-scroll {
      overflow-x: auto;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    
    thead {
      background: rgba(255,255,255,0.03);
    }
    
    th {
      text-align: left;
      padding: var(--space-4);
      font-weight: var(--font-semibold);
      color: var(--text-muted);
      font-size: var(--text-sm);
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-color);
    }
    
    td {
      padding: var(--space-4);
      border-bottom: 1px solid var(--border-color);
    }
    
    tr:last-child td {
      border-bottom: none;
    }
    
    tr:hover {
      background: rgba(255,255,255,0.02);
    }
    
    .user-cell {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-600), var(--accent-600));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: var(--font-bold);
    }
    
    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: var(--font-medium);
      text-transform: uppercase;
    }
    
    .role-badge.owner {
      background: rgba(139, 92, 246, 0.1);
      color: #a78bfa;
    }
    
    .role-badge.trainer {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success-400);
    }
    
    .role-badge.member {
      background: rgba(59, 130, 246, 0.1);
      color: #60a5fa;
    }
    
    .role-badge.pending {
      background: rgba(245, 158, 11, 0.1);
      color: #fbbf24;
    }
    
    .status-badge {
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
    }
    
    .status-badge.approved {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success-400);
    }
    
    .status-badge.pending {
      background: rgba(245, 158, 11, 0.1);
      color: #fbbf24;
    }
    
    .status-badge.rejected {
      background: rgba(239, 68, 68, 0.1);
      color: var(--error-400);
    }
    
    .action-btns {
      display: flex;
      gap: var(--space-2);
    }
    
    .action-btns button {
      padding: var(--space-2);
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .action-btns button:hover {
      border-color: var(--primary-400);
      color: var(--primary-400);
    }
    
    .action-btns button.approve:hover {
      border-color: var(--success-400);
      color: var(--success-400);
    }
    
    .action-btns button.reject:hover {
      border-color: var(--error-400);
      color: var(--error-400);
    }
    
    .empty-state {
      text-align: center;
      padding: var(--space-16);
      color: var(--text-muted);
    }
    
    .empty-state i {
      font-size: 3rem;
      opacity: 0.3;
      margin-bottom: var(--space-4);
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="dashboard-nav">
    <a href="./superadmin-dashboard.html" class="nav-brand">
      <img src="./public/logo.png" alt="Fit Track Pro">
      <span>Super Admin</span>
    </a>
    <div class="nav-links">
      <a href="./superadmin-dashboard.html" class="btn btn-ghost">
        <i class="fa-solid fa-home"></i>
        Dashboard
      </a>
      <a href="./superadmin-gyms.html" class="btn btn-ghost">
        <i class="fa-solid fa-building"></i>
        Gyms
      </a>
      <button id="logoutBtn" class="btn btn-ghost" style="color: var(--error-400);">
        <i class="fa-solid fa-sign-out-alt"></i>
        Logout
      </button>
    </div>
  </nav>

  <main class="main-content" style="padding-top: 80px;">
    <div class="page-container">
      <div class="page-header">
        <h1>
          <i class="fa-solid fa-users"></i>
          Manage Users
        </h1>
      </div>
      
      <!-- Filter Tabs -->
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">
          <i class="fa-solid fa-users"></i>
          All Users
          <span class="count" id="allCount">0</span>
        </button>
        <button class="filter-tab" data-filter="pending">
          <i class="fa-solid fa-clock"></i>
          Pending
          <span class="count" id="pendingCount">0</span>
        </button>
        <button class="filter-tab" data-filter="owners">
          <i class="fa-solid fa-crown"></i>
          Owners
        </button>
        <button class="filter-tab" data-filter="trainers">
          <i class="fa-solid fa-user-tie"></i>
          Trainers
        </button>
        <button class="filter-tab" data-filter="members">
          <i class="fa-solid fa-user"></i>
          Members
        </button>
      </div>
      
      <!-- Users Table -->
      <div class="users-table">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>User</th>
                <th>Role</th>
                <th>Gym</th>
                <th>Contact</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
              <tr>
                <td colspan="6">
                  <div class="empty-state">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <p>Loading users...</p>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script type="module">
    import { auth, database } from './src/config/firebase.js';
    import { onAuthStateChanged, signOut } from 'firebase/auth';
    import { ref, get, set, update, remove } from 'firebase/database';
    import { showSuccess, showError } from './src/components/toast.js';

    let allUsers = [];
    let currentFilter = 'all';
    let gymsMap = {};

    // DOM
    const usersTableBody = document.getElementById('usersTableBody');
    const filterTabs = document.querySelectorAll('.filter-tab');

    // Check auth
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = './superadmin-login.html';
        return;
      }

      const superadminSnap = await get(ref(database, `superadmins/${user.uid}`));
      if (!superadminSnap.exists()) {
        window.location.href = './login.html';
        return;
      }

      // Check URL for tab
      const urlParams = new URLSearchParams(window.location.search);
      const tabParam = urlParams.get('tab');
      if (tabParam === 'pending') {
        currentFilter = 'pending';
        filterTabs.forEach(t => t.classList.remove('active'));
        document.querySelector('[data-filter="pending"]').classList.add('active');
      }

      loadAllUsers();
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = './superadmin-login.html';
    });

    // Filter tabs
    filterTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        filterTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        renderUsers();
      });
    });

    // Load all users
    async function loadAllUsers() {
      try {
        allUsers = [];

        // Load gyms for reference
        const ownersSnap = await get(ref(database, 'owners'));
        if (ownersSnap.exists()) {
          ownersSnap.forEach(snap => {
            const owner = snap.val();
            owner.id = snap.key;
            owner.role = 'owner';
            owner.status = 'approved';
            gymsMap[snap.key] = owner.gymName || 'Unnamed Gym';
            allUsers.push(owner);

            // Get members
            if (owner.members) {
              Object.entries(owner.members).forEach(([memberId, member]) => {
                member.id = memberId;
                member.role = 'member';
                member.gymId = snap.key;
                member.gymName = owner.gymName;
                member.status = member.status || 'approved';
                allUsers.push(member);
              });
            }
          });
        }

        // Load trainers
        const trainersSnap = await get(ref(database, 'trainers'));
        if (trainersSnap.exists()) {
          trainersSnap.forEach(snap => {
            const trainer = snap.val();
            trainer.id = snap.key;
            trainer.role = 'trainer';
            trainer.gymName = gymsMap[trainer.gymId] || 'Unknown Gym';
            trainer.status = trainer.status || 'approved';
            allUsers.push(trainer);
          });
        }

        // Load pending requests
        const requestsSnap = await get(ref(database, 'pending_requests'));
        if (requestsSnap.exists()) {
          requestsSnap.forEach(snap => {
            const req = snap.val();
            req.id = snap.key;
            req.role = req.type;
            // For owner requests, show the proposed gym name
            if (req.type === 'owner' && req.gymData) {
              req.gymName = req.gymData.gymName || 'New Gym';
            } else {
              req.gymName = gymsMap[req.gymId] || 'Unknown Gym';
            }
            req.isPending = req.status === 'pending';
            allUsers.push(req);
          });
        }

        // Update counts
        document.getElementById('allCount').textContent = allUsers.length;
        document.getElementById('pendingCount').textContent = allUsers.filter(u => u.status === 'pending').length;

        renderUsers();
      } catch (error) {
        console.error('Error loading users:', error);
        usersTableBody.innerHTML = `
          <tr><td colspan="6">
            <div class="empty-state">
              <i class="fa-solid fa-exclamation-triangle"></i>
              <p>Failed to load users</p>
            </div>
          </td></tr>
        `;
      }
    }

    // Render users
    function renderUsers() {
      let filtered = [...allUsers];

      if (currentFilter === 'pending') {
        filtered = filtered.filter(u => u.status === 'pending');
      } else if (currentFilter === 'owners') {
        filtered = filtered.filter(u => u.role === 'owner');
      } else if (currentFilter === 'trainers') {
        filtered = filtered.filter(u => u.role === 'trainer' && u.status !== 'pending');
      } else if (currentFilter === 'members') {
        filtered = filtered.filter(u => u.role === 'member' && u.status !== 'pending');
      }

      if (filtered.length === 0) {
        usersTableBody.innerHTML = `
          <tr><td colspan="6">
            <div class="empty-state">
              <i class="fa-solid fa-users"></i>
              <p>No users found</p>
            </div>
          </td></tr>
        `;
        return;
      }

      usersTableBody.innerHTML = filtered.map(user => `
        <tr>
          <td>
            <div class="user-cell">
              <div class="user-avatar">${(user.name || 'U').charAt(0).toUpperCase()}</div>
              <div>
                <div style="font-weight: var(--font-medium);">${user.name || 'Unknown'}</div>
                <div style="font-size: var(--text-xs); color: var(--text-muted);">${user.email || ''}</div>
              </div>
            </div>
          </td>
          <td>
            <span class="role-badge ${user.role} ${user.status === 'pending' ? 'pending' : ''}">
              <i class="fa-solid ${getRoleIcon(user.role)}"></i>
              ${user.role}
            </span>
          </td>
          <td>${user.gymName || (user.role === 'owner' ? user.gymName : '-')}</td>
          <td>
            <div style="font-size: var(--text-sm);">${user.phone || '-'}</div>
          </td>
          <td>
            <span class="status-badge ${user.status || 'approved'}">${user.status || 'Active'}</span>
          </td>
          <td>
            <div class="action-btns">
              ${user.status === 'pending' ? `
                <button class="approve" onclick="approveUser('${user.id}', '${user.role}')" title="Approve">
                  <i class="fa-solid fa-check"></i>
                </button>
                <button class="reject" onclick="rejectUser('${user.id}')" title="Reject">
                  <i class="fa-solid fa-times"></i>
                </button>
              ` : `
                <button onclick="deleteUser('${user.id}', '${user.role}', '${user.gymId || ''}')" title="Delete">
                  <i class="fa-solid fa-trash"></i>
                </button>
              `}
            </div>
          </td>
        </tr>
      `).join('');
    }

    function getRoleIcon(role) {
      const icons = {
        owner: 'fa-crown',
        trainer: 'fa-user-tie',
        member: 'fa-user'
      };
      return icons[role] || 'fa-user';
    }

    // Approve user
    window.approveUser = async function(userId, type) {
      const user = allUsers.find(u => u.id === userId);
      if (!user) return;

      try {
        if (type === 'owner') {
          // Create gym owner in owners collection
          await set(ref(database, `owners/${userId}`), {
            name: user.name,
            email: user.email,
            phone: user.phone,
            gymName: user.gymData?.gymName || 'Unnamed Gym',
            description: user.gymData?.description || '',
            city: user.gymData?.city || '',
            pincode: user.gymData?.pincode || '',
            address: user.gymData?.address || '',
            imageUrl: user.gymData?.imageUrl || '',
            facilities: user.gymData?.facilities || {},
            isPublic: true,
            createdAt: user.createdAt,
            approvedAt: new Date().toISOString(),
            role: 'owner',
            status: 'approved'
          });
        } else if (type === 'member') {
          await set(ref(database, `owners/${user.gymId}/members/${userId}`), {
            name: user.name,
            email: user.email,
            phone: user.phone,
            dob: user.profileData?.dob || '',
            gender: user.profileData?.gender || '',
            address: user.profileData?.address || '',
            gymId: user.gymId,
            joiningDate: user.profileData?.joiningDate || new Date().toISOString().split('T')[0],
            createdAt: user.createdAt,
            approvedAt: new Date().toISOString(),
            role: 'member',
            status: 'approved'
          });
        } else if (type === 'trainer') {
          await set(ref(database, `trainers/${userId}`), {
            name: user.name,
            email: user.email,
            phone: user.phone,
            gymId: user.gymId,
            specialization: user.profileData?.specialization || '',
            experience: user.profileData?.experience || 0,
            createdAt: user.createdAt,
            approvedAt: new Date().toISOString(),
            role: 'trainer',
            status: 'approved',
            assignedMembers: {}
          });
        }

        await update(ref(database, `pending_requests/${userId}`), {
          status: 'approved',
          approvedAt: new Date().toISOString()
        });

        showSuccess(`${user.name} approved!`);
        loadAllUsers();
      } catch (error) {
        console.error('Error approving:', error);
        showError('Failed to approve user');
      }
    };

    // Reject user
    window.rejectUser = async function(userId) {
      if (!confirm('Reject this request?')) return;

      try {
        await update(ref(database, `pending_requests/${userId}`), {
          status: 'rejected',
          rejectedAt: new Date().toISOString()
        });
        showSuccess('Request rejected');
        loadAllUsers();
      } catch (error) {
        showError('Failed to reject');
      }
    };

    // Delete user
    window.deleteUser = async function(userId, role, gymId) {
      if (!confirm('Delete this user? This will remove all their data and cannot be undone.')) return;

      try {
        // Delete from main collection based on role
        if (role === 'owner') {
          await remove(ref(database, `owners/${userId}`));
        } else if (role === 'trainer') {
          await remove(ref(database, `trainers/${userId}`));
        } else if (role === 'member' && gymId) {
          await remove(ref(database, `owners/${gymId}/members/${userId}`));
        }
        
        // Also delete from pending_requests if exists
        await remove(ref(database, `pending_requests/${userId}`));
        
        // Also try to delete from members collection (old structure)
        await remove(ref(database, `members/${userId}`));
        
        showSuccess('User deleted successfully!');
        loadAllUsers();
      } catch (error) {
        console.error('Error deleting user:', error);
        showError('Failed to delete user');
      }
    };
  </script>
</body>
</html>
