<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage join requests for your gym">
  <title>Manage Requests - Fit Track Pro</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="stylesheet" href="./src/styles/dashboard.css">
  <link rel="icon" href="./public/logo.png" type="image/png">
  
  <style>
    .requests-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: var(--space-6);
    }
    
    .page-header {
      margin-bottom: var(--space-8);
    }
    
    .page-header h1 {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      font-size: var(--text-2xl);
      margin-bottom: var(--space-2);
    }
    
    .page-header h1 i {
      color: var(--primary-400);
    }
    
    .tabs {
      display: flex;
      gap: var(--space-2);
      margin-bottom: var(--space-6);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: var(--space-4);
    }
    
    .tab {
      padding: var(--space-2) var(--space-4);
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    
    .tab.active {
      background: var(--primary-600);
      border-color: var(--primary-500);
      color: white;
    }
    
    .tab:hover:not(.active) {
      border-color: var(--primary-400);
      color: var(--text-primary);
    }
    
    .tab .badge {
      background: rgba(255,255,255,0.2);
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
    }
    
    .request-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      margin-bottom: var(--space-4);
      transition: all 0.2s;
    }
    
    .request-card:hover {
      border-color: var(--primary-500);
    }
    
    .request-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: var(--space-4);
    }
    
    .request-user {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    
    .request-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-600), var(--accent-600));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: var(--font-bold);
      font-size: var(--text-lg);
    }
    
    .request-info h3 {
      font-size: var(--text-lg);
      margin-bottom: 2px;
    }
    
    .request-type {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      background: rgba(99, 102, 241, 0.1);
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      color: var(--primary-400);
      text-transform: uppercase;
      font-weight: var(--font-medium);
    }
    
    .request-type.trainer {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success-400);
    }
    
    .request-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: var(--space-4);
      margin-bottom: var(--space-4);
      padding: var(--space-4);
      background: rgba(255,255,255,0.02);
      border-radius: var(--radius-md);
    }
    
    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    
    .detail-label {
      font-size: var(--text-xs);
      color: var(--text-muted);
      text-transform: uppercase;
    }
    
    .detail-value {
      color: var(--text-primary);
    }
    
    .request-actions {
      display: flex;
      gap: var(--space-3);
      padding-top: var(--space-4);
      border-top: 1px solid var(--border-color);
    }
    
    .request-date {
      color: var(--text-muted);
      font-size: var(--text-sm);
    }
    
    .empty-state {
      text-align: center;
      padding: var(--space-16);
      color: var(--text-muted);
    }
    
    .empty-state i {
      font-size: 4rem;
      margin-bottom: var(--space-4);
      opacity: 0.3;
    }
    
    .loading-state {
      text-align: center;
      padding: var(--space-16);
    }
    
    .status-badge {
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: var(--font-medium);
    }
    
    .status-badge.approved {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success-400);
    }
    
    .status-badge.rejected {
      background: rgba(239, 68, 68, 0.1);
      color: var(--error-400);
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="dashboard-nav">
    <a href="./owner-dashboard.html" class="nav-brand">
      <img src="./public/logo.png" alt="Fit Track Pro">
      <span>Fit Track Pro</span>
    </a>
    <div class="nav-links">
      <a href="./owner-dashboard.html" class="btn btn-ghost">
        <i class="fa-solid fa-arrow-left"></i>
        Back to Dashboard
      </a>
    </div>
  </nav>

  <main class="main-content" style="padding-top: 80px;">
    <div class="requests-container">
      <div class="page-header">
        <h1>
          <i class="fa-solid fa-user-clock"></i>
          Manage Join Requests
        </h1>
        <p style="color: var(--text-muted);">Review and approve member and trainer requests for your gym</p>
      </div>
      
      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" data-tab="pending">
          <i class="fa-solid fa-clock"></i>
          Pending
          <span class="badge" id="pendingCount">0</span>
        </button>
        <button class="tab" data-tab="approved">
          <i class="fa-solid fa-check"></i>
          Approved
        </button>
        <button class="tab" data-tab="rejected">
          <i class="fa-solid fa-times"></i>
          Rejected
        </button>
      </div>
      
      <!-- Requests List -->
      <div id="requestsList">
        <div class="loading-state">
          <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; color: var(--primary-400);"></i>
          <p style="margin-top: var(--space-4); color: var(--text-muted);">Loading requests...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script type="module">
    import { auth, database } from './src/config/firebase.js';
    import { onAuthStateChanged } from 'firebase/auth';
    import { ref, get, set, remove, update } from 'firebase/database';
    import { showSuccess, showError } from './src/components/toast.js';

    let currentOwnerId = null;
    let currentTab = 'pending';
    let allRequests = [];

    // DOM Elements
    const requestsList = document.getElementById('requestsList');
    const pendingCount = document.getElementById('pendingCount');
    const tabs = document.querySelectorAll('.tab');

    // Check auth
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = './login.html';
        return;
      }

      // Verify owner
      const ownerSnap = await get(ref(database, `owners/${user.uid}`));
      if (!ownerSnap.exists()) {
        showError('Only gym owners can access this page');
        window.location.href = './login.html';
        return;
      }

      currentOwnerId = user.uid;
      loadRequests();
    });

    // Tab switching
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentTab = tab.dataset.tab;
        renderRequests();
      });
    });

    // Load all requests for this gym
    async function loadRequests() {
      try {
        const requestsSnap = await get(ref(database, 'pending_requests'));
        allRequests = [];

        if (requestsSnap.exists()) {
          requestsSnap.forEach(snap => {
            const req = snap.val();
            if (req.gymId === currentOwnerId) {
              req.id = snap.key;
              allRequests.push(req);
            }
          });
        }

        // Sort by date (newest first)
        allRequests.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        // Update pending count
        const pending = allRequests.filter(r => r.status === 'pending').length;
        pendingCount.textContent = pending;

        renderRequests();
      } catch (error) {
        console.error('Error loading requests:', error);
        requestsList.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-exclamation-triangle"></i>
            <p>Failed to load requests</p>
          </div>
        `;
      }
    }

    // Render requests for current tab
    function renderRequests() {
      const filtered = allRequests.filter(r => r.status === currentTab);

      if (filtered.length === 0) {
        const messages = {
          pending: 'No pending requests',
          approved: 'No approved requests yet',
          rejected: 'No rejected requests'
        };
        requestsList.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-inbox"></i>
            <p>${messages[currentTab]}</p>
          </div>
        `;
        return;
      }

      requestsList.innerHTML = filtered.map(req => `
        <div class="request-card" data-id="${req.id}">
          <div class="request-header">
            <div class="request-user">
              <div class="request-avatar">${req.name.charAt(0).toUpperCase()}</div>
              <div class="request-info">
                <h3>${req.name}</h3>
                <span class="request-type ${req.type}">
                  <i class="fa-solid ${req.type === 'member' ? 'fa-user' : 'fa-user-tie'}"></i>
                  ${req.type}
                </span>
              </div>
            </div>
            <div class="request-date">
              ${formatDate(req.createdAt)}
            </div>
          </div>
          
          <div class="request-details">
            <div class="detail-item">
              <span class="detail-label">Email</span>
              <span class="detail-value">${req.email}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Phone</span>
              <span class="detail-value">${req.phone}</span>
            </div>
            ${req.type === 'member' && req.profileData ? `
              <div class="detail-item">
                <span class="detail-label">Date of Birth</span>
                <span class="detail-value">${req.profileData.dob || 'N/A'}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Gender</span>
                <span class="detail-value">${req.profileData.gender || 'N/A'}</span>
              </div>
            ` : ''}
            ${req.type === 'trainer' && req.profileData ? `
              <div class="detail-item">
                <span class="detail-label">Specialization</span>
                <span class="detail-value">${req.profileData.specialization || 'N/A'}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Experience</span>
                <span class="detail-value">${req.profileData.experience || 0} years</span>
              </div>
            ` : ''}
          </div>
          
          ${currentTab === 'pending' ? `
            <div class="request-actions">
              <button class="btn btn-primary" onclick="approveRequest('${req.id}')">
                <i class="fa-solid fa-check"></i>
                Approve
              </button>
              <button class="btn btn-ghost" style="color: var(--error-400);" onclick="rejectRequest('${req.id}')">
                <i class="fa-solid fa-times"></i>
                Reject
              </button>
            </div>
          ` : `
            <div class="request-actions" style="justify-content: flex-end;">
              <span class="status-badge ${req.status}">${req.status.charAt(0).toUpperCase() + req.status.slice(1)}</span>
            </div>
          `}
        </div>
      `).join('');
    }

    // Format date
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-IN', { 
        day: 'numeric', 
        month: 'short', 
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // Approve request
    window.approveRequest = async function(requestId) {
      const req = allRequests.find(r => r.id === requestId);
      if (!req) return;

      try {
        if (req.type === 'member') {
          // Move to owner's members collection
          await set(ref(database, `owners/${currentOwnerId}/members/${req.userId}`), {
            name: req.name,
            email: req.email,
            phone: req.phone,
            dob: req.profileData?.dob || '',
            gender: req.profileData?.gender || '',
            address: req.profileData?.address || '',
            gymId: currentOwnerId,
            joiningDate: req.profileData?.joiningDate || new Date().toISOString().split('T')[0],
            createdAt: req.createdAt,
            approvedAt: new Date().toISOString(),
            role: 'member',
            status: 'approved',
            notifications: {}
          });
        } else {
          // Move to trainers collection
          await set(ref(database, `trainers/${req.userId}`), {
            name: req.name,
            email: req.email,
            phone: req.phone,
            gymId: currentOwnerId,
            specialization: req.profileData?.specialization || '',
            experience: req.profileData?.experience || 0,
            createdAt: req.createdAt,
            approvedAt: new Date().toISOString(),
            role: 'trainer',
            status: 'approved',
            assignedMembers: {}
          });
        }

        // Update request status
        await update(ref(database, `pending_requests/${requestId}`), {
          status: 'approved',
          approvedAt: new Date().toISOString()
        });

        showSuccess(`${req.name} has been approved!`);
        loadRequests();
      } catch (error) {
        console.error('Error approving request:', error);
        showError('Failed to approve request');
      }
    };

    // Reject request
    window.rejectRequest = async function(requestId) {
      const req = allRequests.find(r => r.id === requestId);
      if (!req) return;

      if (!confirm(`Are you sure you want to reject ${req.name}'s request?`)) return;

      try {
        await update(ref(database, `pending_requests/${requestId}`), {
          status: 'rejected',
          rejectedAt: new Date().toISOString()
        });

        showSuccess(`${req.name}'s request has been rejected`);
        loadRequests();
      } catch (error) {
        console.error('Error rejecting request:', error);
        showError('Failed to reject request');
      }
    };
  </script>
</body>
</html>
