<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>View Bill Receipts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="member_dashboard.css">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="dashboard-container">
    <header class="dashboard-header">
      <h1>Bill Receipts</h1>
      <p>Below are your payment records</p>
    </header>

    <!-- Filter -->
    <div style="text-align:center; margin-bottom: 20px;">
      <label for="filter">Filter by status: </label>
      <select id="filter">
        <option value="All">All</option>
        <option value="Paid">Paid</option>
        <option value="Unpaid">Unpaid</option>
      </select>
    </div>

    <div id="receiptList" class="dashboard-grid">
      <p>Loading receipts...</p>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC-oca5z39s7l77EDY_Jx1psRroWtfZ2pM",
      authDomain: "fit-track-be443.firebaseapp.com",
      databaseURL: "https://fit-track-be443-default-rtdb.firebaseio.com",
      projectId: "fit-track-be443",
      storageBucket: "fit-track-be443.appspot.com",
      messagingSenderId: "485684449281",
      appId: "1:485684449281:web:88991ce3596959c0433000"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const receiptList = document.getElementById("receiptList");
    const filterSelect = document.getElementById("filter");

    function renderReceipts(bills) {
      receiptList.innerHTML = "";
      if (bills.length === 0) {
        receiptList.innerHTML = "<p>No matching bills found.</p>";
        return;
      }

      bills.forEach(bill => {
        const item = document.createElement("div");
        item.className = "dashboard-item";
        item.innerHTML = `
          <i class="fa fa-file-invoice-dollar"></i>
          <p><strong>Amount:</strong> ₹${bill.amount}</p>
          <p><strong>Date:</strong> ${bill.date}</p>
          <p><strong>Status:</strong> ${bill.status}</p>
        `;
        receiptList.appendChild(item);
      });
    }

    function loadReceipts() {
      const memberId = localStorage.getItem("memberUID");
      const filter = filterSelect.value;

      if (!memberId) {
        receiptList.innerHTML = "<p>Login required.</p>";
        return;
      }

      receiptList.innerHTML = "<p>Loading receipts...</p>";

      const ref = database.ref(`bills/${memberId}/bill_receipts`);
      ref.once("value", snapshot => {
        const bills = [];

        snapshot.forEach(child => {
          const bill = child.val();
          if (filter === "All" || bill.status === filter) {
            bills.push(bill);
          }
        });

        // Sort by date descending (newest first)
        bills.sort((a, b) => new Date(b.date) - new Date(a.date));

        renderReceipts(bills);
      });
    }

    filterSelect.addEventListener("change", loadReceipts);
    loadReceipts(); // initial load
  </script>
</body>
</html>
