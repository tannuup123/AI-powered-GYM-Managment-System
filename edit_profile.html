<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Profile</title>
  <link rel="stylesheet" href="edit_profile.css" />
</head>
<body>
  <div class="container">
    <h2>Edit Profile</h2>
    <p class="subheading">Update your account details below</p>

    <form id="editForm">
      <label for="name">Name:</label>
      <input type="text" id="name" required />

      <label for="phone">Phone:</label>
      <input type="text" id="phone" />

      <label for="newPassword">New Password (optional):</label>
      <input type="password" id="newPassword" />

      <button type="submit">Save Changes</button>
      <div id="statusMsg"></div>
    </form>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC-oca5z39s7l77EDY_Jx1psRroWtfZ2pM",
      authDomain: "fit-track-be443.firebaseapp.com",
      databaseURL: "https://fit-track-be443-default-rtdb.firebaseio.com",
      projectId: "fit-track-be443",
      storageBucket: "fit-track-be443.appspot.com",
      messagingSenderId: "485684449281",
      appId: "1:485684449281:web:88991ce3596959c0433000"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const nameInput = document.getElementById("name");
    const phoneInput = document.getElementById("phone");
    const newPasswordInput = document.getElementById("newPassword");
    const statusMsg = document.getElementById("statusMsg");

    auth.onAuthStateChanged(user => {
      if (!user) {
        alert("Not logged in");
        location.href = "login.html";
        return;
      }

      const uid = user.uid;

      // Load current member data
      db.ref("owners").once("value").then(snapshot => {
        snapshot.forEach(ownerSnap => {
          const members = ownerSnap.child("members").val();
          if (members && members[uid]) {
            const member = members[uid];
            nameInput.value = member.name || "";
            phoneInput.value = member.phone || "";
          }
        });
      });

      // Form submission
      document.getElementById("editForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const name = nameInput.value.trim();
        const phone = phoneInput.value.trim();
        const newPassword = newPasswordInput.value;

        if (!name) {
          alert("Name is required");
          return;
        }

        // Update in Realtime DB
        db.ref("owners").once("value").then(snapshot => {
          snapshot.forEach(ownerSnap => {
            const membersRef = ownerSnap.ref.child("members");
            const members = ownerSnap.child("members").val();
            if (members && members[uid]) {
              membersRef.child(uid).update({ name, phone });
            }
          });

          if (newPassword) {
            user.updatePassword(newPassword).then(() => {
              statusMsg.textContent = "Profile updated & password changed.";
              window.location.href = "member_dashboard.html";
            }).catch(err => {
              statusMsg.textContent = "Password update failed: " + err.message;
            });
          } else {
            statusMsg.textContent = "Profile updated.";
            window.location.href = "member_dashboard.html";
          }
        });
      });
    });
  </script>
</body>
</html>
