<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage Members - Fit Track Pro">
  <title>Manage Members - Fit Track Pro</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="icon" href="./public/logo.png" type="image/png">
</head>
<body>
  <div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="./public/logo.png" alt="Fit Track Pro" class="sidebar-logo">
        <span class="sidebar-brand">Fit Track Pro</span>
      </div>
      
      <nav class="sidebar-nav">
        <div class="nav-section">
          <span class="nav-section-title">Main</span>
          <a href="./owner-dashboard.html" class="nav-link">
            <i class="fa-solid fa-home"></i>
            <span>Dashboard</span>
          </a>
        </div>
        
        <div class="nav-section">
          <span class="nav-section-title">Members</span>
          <a href="./add-member.html" class="nav-link">
            <i class="fa-solid fa-user-plus"></i>
            <span>Add Member</span>
          </a>
          <a href="./manage-members.html" class="nav-link active">
            <i class="fa-solid fa-users"></i>
            <span>Manage Members</span>
          </a>
        </div>
      </nav>
      
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="avatar avatar-placeholder" id="userAvatar">O</div>
          <div class="user-details">
            <div class="user-name" id="userName">Loading...</div>
            <div class="user-role">Gym Owner</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Mobile Sidebar Toggle -->
    <button class="sidebar-toggle" id="sidebarToggle">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <a href="./owner-dashboard.html" style="display: inline-flex; align-items: center; gap: var(--space-2); color: var(--text-muted); margin-bottom: var(--space-4); font-size: var(--text-sm);">
          <i class="fa-solid fa-arrow-left"></i>
          Back to Dashboard
        </a>
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-4);">
          <div>
            <h1><i class="fa-solid fa-users" style="color: var(--primary-400);"></i> Manage Members</h1>
            <p>View and manage all gym members</p>
          </div>
          <a href="./add-member.html" class="btn btn-primary">
            <i class="fa-solid fa-plus"></i>
            Add Member
          </a>
        </div>
      </div>

      <!-- Search & Filter -->
      <div class="card" style="margin-bottom: var(--space-6);">
        <div style="display: flex; gap: var(--space-4); flex-wrap: wrap;">
          <div class="form-group" style="flex: 1; min-width: 200px; margin: 0;">
            <input 
              type="text" 
              id="searchInput" 
              class="form-input" 
              placeholder="Search by name, email, or phone..."
            >
          </div>
          <select id="filterPlan" class="form-input" style="width: auto;">
            <option value="">All Plans</option>
            <option value="Monthly">Monthly</option>
            <option value="Quarterly">Quarterly</option>
            <option value="Half-Yearly">Half-Yearly</option>
            <option value="Yearly">Yearly</option>
          </select>
          <select id="filterStatus" class="form-input" style="width: auto;">
            <option value="">All Status</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
      </div>

      <!-- Members Table -->
      <div class="card">
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>Member</th>
                <th>Contact</th>
                <th>Plan</th>
                <th>Joined</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="membersTableBody">
              <tr>
                <td colspan="6" style="text-align: center; padding: var(--space-8); color: var(--text-muted);">
                  <i class="fa-solid fa-spinner fa-spin" style="font-size: 1.5rem;"></i>
                  <p style="margin-top: var(--space-2);">Loading members...</p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Edit Member Modal -->
      <div class="modal-backdrop" id="editModal">
        <div class="modal" style="max-width: 500px;">
          <div class="modal-header">
            <h3>Edit Member</h3>
            <button class="btn btn-ghost btn-icon" id="closeEditModal">&times;</button>
          </div>
          <form id="editMemberForm" class="modal-body">
            <input type="hidden" id="editMemberId">
            
            <div class="form-group">
              <label for="editName" class="form-label">Full Name *</label>
              <input type="text" id="editName" class="form-input" required>
            </div>
            
            <div class="form-group">
              <label for="editEmail" class="form-label">Email *</label>
              <input type="email" id="editEmail" class="form-input" required>
            </div>
            
            <div class="form-group">
              <label for="editPhone" class="form-label">Phone *</label>
              <input type="tel" id="editPhone" class="form-input" pattern="[0-9]{10}" required>
            </div>
            
            <div class="form-group">
              <label for="editPlan" class="form-label">Plan</label>
              <select id="editPlan" class="form-input">
                <option value="Monthly">Monthly</option>
                <option value="Quarterly">Quarterly</option>
                <option value="Half-Yearly">Half-Yearly</option>
                <option value="Yearly">Yearly</option>
              </select>
            </div>
            
            <div class="form-group">
              <label for="editStatus" class="form-label">Status</label>
              <select id="editStatus" class="form-input">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>
            
            <div style="display: flex; gap: var(--space-4); justify-content: flex-end;">
              <button type="button" class="btn btn-secondary" id="cancelEdit">Cancel</button>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script type="module">
    import { auth, database } from './src/config/firebase.js';
    import { onAuthStateChanged } from 'firebase/auth';
    import { ref, get, update, remove } from 'firebase/database';
    import { showToast, showSuccess, showError, showWarning, showInfo } from './src/components/toast.js';

    // DOM Elements
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const membersTableBody = document.getElementById('membersTableBody');
    const searchInput = document.getElementById('searchInput');
    const filterPlan = document.getElementById('filterPlan');
    const filterStatus = document.getElementById('filterStatus');
    const editModal = document.getElementById('editModal');
    const editMemberForm = document.getElementById('editMemberForm');
    const closeEditModal = document.getElementById('closeEditModal');
    const cancelEdit = document.getElementById('cancelEdit');

    let currentOwnerId = null;
    let allMembers = [];

    // Mobile sidebar toggle
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('active');
    });

    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('active');
    });

    // Modal handlers
    function openModal() {
      editModal.classList.add('active');
    }

    function closeModalFunc() {
      editModal.classList.remove('active');
    }

    closeEditModal.addEventListener('click', closeModalFunc);
    cancelEdit.addEventListener('click', closeModalFunc);

    // Auth state
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        showError('Please log in to continue');
        setTimeout(() => window.location.href = './login.html', 1500);
        return;
      }

      currentOwnerId = user.uid;

      try {
        const ownerSnap = await get(ref(database, `owners/${user.uid}`));
        if (ownerSnap.exists()) {
          const owner = ownerSnap.val();
          document.getElementById('userName').textContent = owner.name || 'Owner';
          document.getElementById('userAvatar').textContent = (owner.name || 'O').charAt(0).toUpperCase();
        }

        loadMembers();
      } catch (error) {
        console.error('Error loading data:', error);
      }
    });

    // Load members
    async function loadMembers() {
      try {
        const membersSnap = await get(ref(database, `owners/${currentOwnerId}/members`));
        
        if (!membersSnap.exists()) {
          membersTableBody.innerHTML = `
            <tr>
              <td colspan="6" style="text-align: center; padding: var(--space-8); color: var(--text-muted);">
                <i class="fa-solid fa-users" style="font-size: 2rem; margin-bottom: var(--space-2);"></i>
                <p>No members found</p>
                <a href="./add-member.html" class="btn btn-primary" style="margin-top: var(--space-4);">Add Your First Member</a>
              </td>
            </tr>
          `;
          return;
        }

        allMembers = [];
        membersSnap.forEach(snap => {
          allMembers.push({ id: snap.key, ...snap.val() });
        });

        renderMembers(allMembers);
      } catch (error) {
        console.error('Error loading members:', error);
        showError('Failed to load members');
      }
    }

    // Render members table
    function renderMembers(members) {
      if (members.length === 0) {
        membersTableBody.innerHTML = `
          <tr>
            <td colspan="6" style="text-align: center; padding: var(--space-8); color: var(--text-muted);">
              No members match your search criteria
            </td>
          </tr>
        `;
        return;
      }

      membersTableBody.innerHTML = members.map(member => `
        <tr>
          <td>
            <div style="display: flex; align-items: center; gap: var(--space-3);">
              <div class="avatar avatar-placeholder" style="width: 40px; height: 40px; font-size: var(--text-sm);">
                ${(member.name || 'M').charAt(0).toUpperCase()}
              </div>
              <div>
                <div style="font-weight: var(--font-medium);">${member.name || 'N/A'}</div>
                <div style="font-size: var(--text-xs); color: var(--text-muted);">${member.email || 'No email'}</div>
              </div>
            </div>
          </td>
          <td>${member.phone || 'N/A'}</td>
          <td><span class="badge badge-primary">${member.plan || 'N/A'}</span></td>
          <td>${member.joiningDate || 'N/A'}</td>
          <td>
            <span class="badge ${member.status === 'Active' ? 'badge-success' : 'badge-warning'}">
              ${member.status || 'Active'}
            </span>
          </td>
          <td>
            <div style="display: flex; gap: var(--space-2);">
              <button class="btn btn-ghost btn-icon" onclick="editMember('${member.id}')" title="Edit">
                <i class="fa-solid fa-edit"></i>
              </button>
              <button class="btn btn-ghost btn-icon" onclick="deleteMember('${member.id}')" title="Delete" style="color: var(--error-400);">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    // Filter & search
    function filterMembers() {
      const search = searchInput.value.toLowerCase();
      const plan = filterPlan.value;
      const status = filterStatus.value;

      const filtered = allMembers.filter(m => {
        const matchSearch = !search || 
          (m.name && m.name.toLowerCase().includes(search)) ||
          (m.email && m.email.toLowerCase().includes(search)) ||
          (m.phone && m.phone.includes(search));
        const matchPlan = !plan || m.plan === plan;
        const matchStatus = !status || m.status === status;
        return matchSearch && matchPlan && matchStatus;
      });

      renderMembers(filtered);
    }

    searchInput.addEventListener('input', filterMembers);
    filterPlan.addEventListener('change', filterMembers);
    filterStatus.addEventListener('change', filterMembers);

    // Edit member
    window.editMember = function(id) {
      const member = allMembers.find(m => m.id === id);
      if (!member) return;

      document.getElementById('editMemberId').value = id;
      document.getElementById('editName').value = member.name || '';
      document.getElementById('editEmail').value = member.email || '';
      document.getElementById('editPhone').value = member.phone || '';
      document.getElementById('editPlan').value = member.plan || 'Monthly';
      document.getElementById('editStatus').value = member.status || 'Active';
      
      openModal();
    };

    // Save edit
    editMemberForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const id = document.getElementById('editMemberId').value;
      const updates = {
        name: document.getElementById('editName').value.trim(),
        email: document.getElementById('editEmail').value.trim(),
        phone: document.getElementById('editPhone').value.trim(),
        plan: document.getElementById('editPlan').value,
        status: document.getElementById('editStatus').value
      };

      try {
        await update(ref(database, `owners/${currentOwnerId}/members/${id}`), updates);
        showSuccess('Member updated successfully!');
        closeModalFunc();
        loadMembers();
      } catch (error) {
        console.error('Error updating member:', error);
        showError('Failed to update member');
      }
    });

    // Delete member
    window.deleteMember = async function(id) {
      if (!confirm('Are you sure you want to delete this member? This action cannot be undone.')) {
        return;
      }

      try {
        await remove(ref(database, `owners/${currentOwnerId}/members/${id}`));
        showSuccess('Member deleted successfully');
        loadMembers();
      } catch (error) {
        console.error('Error deleting member:', error);
        showError('Failed to delete member');
      }
    };
  </script>
</body>
</html>
