<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your Fit Track Pro password">
  <title>Forgot Password - Fit Track Pro</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="icon" href="./public/logo.png" type="image/png">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <!-- Back Button -->
        <a href="./login.html" style="display: inline-flex; align-items: center; gap: var(--space-2); color: var(--text-muted); margin-bottom: var(--space-4); font-size: var(--text-sm);">
          <i class="fa-solid fa-arrow-left"></i>
          Back to login
        </a>

        <!-- Logo -->
        <div class="auth-logo">
          <img src="./public/logo.png" alt="Fit Track Pro Logo">
          <h1>Reset Password</h1>
          <p>Enter your email to receive a reset link</p>
        </div>

        <!-- Form - Initial State -->
        <form id="resetForm" class="auth-form">
          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-input" 
              placeholder="Enter your registered email"
              required
              autocomplete="email"
            >
          </div>

          <button type="submit" id="resetBtn" class="btn btn-primary">
            <i class="fa-solid fa-paper-plane"></i>
            <span id="btnText">Send Reset Link</span>
          </button>
        </form>

        <!-- Success State (Hidden Initially) -->
        <div id="successState" style="display: none; text-align: center;">
          <div style="width: 80px; height: 80px; background: rgba(16, 185, 129, 0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-6);">
            <i class="fa-solid fa-check" style="font-size: 2rem; color: var(--success-400);"></i>
          </div>
          <h2 style="margin-bottom: var(--space-3);">Check Your Email</h2>
          <p style="color: var(--text-secondary); margin-bottom: var(--space-6);">
            We've sent a password reset link to<br>
            <strong id="sentEmail" style="color: var(--text-primary);"></strong>
          </p>
          <p style="color: var(--text-muted); font-size: var(--text-sm);">
            Didn't receive the email? Check your spam folder or
            <button type="button" id="resendBtn" style="background: none; border: none; color: var(--primary-400); cursor: pointer; text-decoration: underline;">resend</button>
          </p>
        </div>

        <!-- Footer -->
        <div class="auth-footer">
          <p>Remember your password? <a href="./login.html">Sign in</a></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module">
    import { auth } from './src/config/firebase.js';
    import { sendPasswordResetEmail } from 'firebase/auth';
    import { showToast, showSuccess, showError, showWarning, showInfo } from './src/components/toast.js';
    import { setButtonLoading, isValidEmail } from './src/js/utils.js';

    // DOM Elements
    const resetForm = document.getElementById('resetForm');
    const resetBtn = document.getElementById('resetBtn');
    const btnText = document.getElementById('btnText');
    const successState = document.getElementById('successState');
    const sentEmail = document.getElementById('sentEmail');
    const resendBtn = document.getElementById('resendBtn');

    let userEmail = '';

    // Handle password reset
    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();

      if (!email) {
        showWarning('Please enter your email address');
        return;
      }

      if (!isValidEmail(email)) {
        showError('Please enter a valid email address');
        return;
      }

      userEmail = email;
      await sendResetEmail(email);
    });

    // Send reset email function
    async function sendResetEmail(email) {
      setButtonLoading(resetBtn, true, 'Sending...');
      btnText.textContent = 'Sending...';

      try {
        await sendPasswordResetEmail(auth, email);
        
        // Show success state
        resetForm.style.display = 'none';
        successState.style.display = 'block';
        sentEmail.textContent = email;
        
        showSuccess('Reset link sent successfully!');

      } catch (error) {
        console.error('Password reset error:', error);
        
        let message = 'Failed to send reset email. Please try again.';
        if (error.code === 'auth/user-not-found') {
          message = 'No account found with this email address.';
        } else if (error.code === 'auth/too-many-requests') {
          message = 'Too many requests. Please try again later.';
        } else if (error.code === 'auth/invalid-email') {
          message = 'Invalid email address format.';
        }
        
        showError(message);
        setButtonLoading(resetBtn, false);
        btnText.textContent = 'Send Reset Link';
      }
    }

    // Resend email
    resendBtn.addEventListener('click', async () => {
      if (userEmail) {
        resendBtn.disabled = true;
        resendBtn.textContent = 'Sending...';
        
        try {
          await sendPasswordResetEmail(auth, userEmail);
          showInfo('Reset link resent!');
          resendBtn.textContent = 'Sent!';
          
          setTimeout(() => {
            resendBtn.textContent = 'resend';
            resendBtn.disabled = false;
          }, 30000); // Allow resend after 30 seconds
          
        } catch (error) {
          if (error.code === 'auth/too-many-requests') {
            showWarning('Please wait before requesting another email.');
          } else {
            showError('Failed to resend. Please try again.');
          }
          resendBtn.textContent = 'resend';
          resendBtn.disabled = false;
        }
      }
    });
  </script>
</body>
</html>
