<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Super Admin Login - Fit Track Pro">
  <title>Super Admin Login - Fit Track Pro</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="icon" href="./public/logo.png" type="image/png">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <!-- Logo -->
        <div class="auth-logo">
          <img src="./public/logo.png" alt="Fit Track Pro Logo">
          <h1>Super Admin</h1>
          <p>Master Control Panel</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-input" 
              placeholder="admin@fittrack.com"
              required
              autocomplete="email"
            >
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div class="password-wrapper">
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-input" 
                placeholder="Enter password"
                required
                autocomplete="current-password"
              >
              <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                <i class="fa-solid fa-eye" id="eyeIcon"></i>
              </button>
            </div>
          </div>

          <button type="submit" id="loginBtn" class="btn btn-primary">
            <span id="btnText">Sign In as Admin</span>
          </button>
        </form>

        <!-- Footer -->
        <div class="auth-footer">
          <p><a href="./login.html">← Back to regular login</a></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module">
    import { auth, database } from './src/config/firebase.js';
    import { signInWithEmailAndPassword } from 'firebase/auth';
    import { ref, get } from 'firebase/database';
    import { showError, showSuccess, showWarning } from './src/components/toast.js';
    import { setButtonLoading } from './src/js/utils.js';

    // DOM Elements
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    // Toggle password visibility
    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.classList.toggle('fa-eye', !isPassword);
      eyeIcon.classList.toggle('fa-eye-slash', isPassword);
    });

    // Handle login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError('Please enter both email and password.');
        return;
      }

      setButtonLoading(loginBtn, true, 'Signing in...');
      btnText.textContent = 'Signing in...';

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const uid = userCredential.user.uid;

        // Verify superadmin
        const superadminSnap = await get(ref(database, `superadmins/${uid}`));
        
        if (!superadminSnap.exists()) {
          showError('Access denied. Not a super admin.');
          await auth.signOut();
          setButtonLoading(loginBtn, false);
          btnText.textContent = 'Sign In as Admin';
          return;
        }

        showSuccess('Welcome Super Admin! Redirecting...');
        setTimeout(() => {
          window.location.href = './superadmin-dashboard.html';
        }, 1000);

      } catch (error) {
        console.error('Login error:', error);
        
        let message = 'Login failed. Please try again.';
        if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
          message = 'Invalid email or password.';
        } else if (error.code === 'auth/too-many-requests') {
          message = 'Too many failed attempts. Please try again later.';
        }
        
        showError(message);
        setButtonLoading(loginBtn, false);
        btnText.textContent = 'Sign In as Admin';
      }
    });
  </script>
</body>
</html>
