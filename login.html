<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fit Track Pro - Premium gym management system for owners, trainers, and members">
  <title>Login - Fit Track Pro</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="icon" href="./public/logo.png" type="image/png">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <!-- Logo -->
        <div class="auth-logo">
          <img src="./public/logo.png" alt="Fit Track Pro Logo">
          <h1>Fit Track Pro</h1>
          <p>Your complete gym management solution</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-input" 
              placeholder="Enter your email"
              required
              autocomplete="email"
            >
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div class="password-wrapper">
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-input" 
                placeholder="Enter your password"
                required
                autocomplete="current-password"
              >
              <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                <i class="fa-solid fa-eye" id="eyeIcon"></i>
              </button>
            </div>
          </div>

          <div class="auth-options">
            <label class="form-check">
              <input type="checkbox" name="remember" checked>
              <span>Remember me</span>
            </label>
            <a href="./forgot-password.html">Forgot password?</a>
          </div>

          <button type="submit" id="loginBtn" class="btn btn-primary">
            <span id="btnText">Sign In</span>
          </button>
        </form>

        <!-- Social Login -->
        <div class="auth-divider">
          <span>or continue with</span>
        </div>

        <div class="social-login-buttons">
          <button type="button" class="social-btn google" id="googleLoginBtn">
            <i class="fab fa-google"></i>
            <span>Google</span>
          </button>
        </div>

        <!-- Footer -->
        <div class="auth-footer">
          <p>New to Fit Track Pro? <a href="./role.html">Create an account</a></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module">
    import { auth, database } from './src/config/firebase.js';
    import { signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signOut } from 'firebase/auth';
    import { ref, get } from 'firebase/database';
    import { showToast, showError, showSuccess, showWarning } from './src/components/toast.js';
    import { setButtonLoading } from './src/js/utils.js';

    // DOM Elements
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    const googleLoginBtn = document.getElementById('googleLoginBtn');

    // Toggle password visibility
    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.classList.toggle('fa-eye', !isPassword);
      eyeIcon.classList.toggle('fa-eye-slash', isPassword);
    });

    // Get user role and redirect
    async function getUserRoleAndRedirect(uid) {
      // Check if user has a pending request
      const pendingSnap = await get(ref(database, `pending_requests/${uid}`));
      if (pendingSnap.exists()) {
        const pending = pendingSnap.val();
        if (pending.status === 'pending') {
          showWarning('Your account is pending approval from the gym owner.');
          await signOut(auth);
          return true;
        } else if (pending.status === 'rejected') {
          showError('Your request to join was rejected.');
          await signOut(auth);
          return true;
        }
        // If approved, continue to check normal paths
      }

      // Check superadmin
      const superadminSnap = await get(ref(database, `superadmins/${uid}`));
      if (superadminSnap.exists()) {
        showSuccess('Welcome Super Admin! Redirecting...');
        setTimeout(() => window.location.href = './superadmin-dashboard.html', 1000);
        return true;
      }

      // Check owners first (direct path)
      const ownerSnap = await get(ref(database, `owners/${uid}`));
      if (ownerSnap.exists()) {
        showSuccess('Welcome back! Redirecting...');
        setTimeout(() => window.location.href = './owner-dashboard.html', 1000);
        return true;
      }

      // Check trainers (direct path)
      const trainerSnap = await get(ref(database, `trainers/${uid}`));
      if (trainerSnap.exists()) {
        showSuccess('Welcome back! Redirecting...');
        setTimeout(() => window.location.href = './trainer-dashboard.html', 1000);
        return true;
      }

      // Check members (stored under owners/{ownerId}/members/{uid})
      const ownersSnap = await get(ref(database, 'owners'));
      if (ownersSnap.exists()) {
        let foundMember = false;
        ownersSnap.forEach(ownerSnap => {
          const members = ownerSnap.child('members').val();
          if (members && members[uid]) {
            foundMember = true;
          }
        });
        if (foundMember) {
          showSuccess('Welcome back! Redirecting...');
          setTimeout(() => window.location.href = './member-dashboard.html', 1000);
          return true;
        }
      }

      return false;
    }

    // Handle login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError('Please enter both email and password.');
        return;
      }

      setButtonLoading(loginBtn, true, 'Signing in...');
      btnText.textContent = 'Signing in...';

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const uid = userCredential.user.uid;
        
        const found = await getUserRoleAndRedirect(uid);
        if (!found) {
          showError('User role not found. Please contact support.');
          setButtonLoading(loginBtn, false);
          btnText.textContent = 'Sign In';
        }
      } catch (error) {
        console.error('Login error:', error);
        let message = 'Login failed. Please try again.';
        if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
          message = 'Invalid email or password.';
        } else if (error.code === 'auth/too-many-requests') {
          message = 'Too many attempts. Please try again later.';
        }
        showError(message);
        setButtonLoading(loginBtn, false);
        btnText.textContent = 'Sign In';
      }
    });

    // Google Sign In
    googleLoginBtn.addEventListener('click', async () => {
      const provider = new GoogleAuthProvider();
      
      try {
        const result = await signInWithPopup(auth, provider);
        const uid = result.user.uid;
        
        const found = await getUserRoleAndRedirect(uid);
        if (!found) {
          showToast('Please complete your registration first.', 'warning');
          setTimeout(() => {
            window.location.href = './role.html';
          }, 2000);
        }
      } catch (error) {
        console.error('Google login error:', error);
        showError('Google sign-in failed. Please try again.');
      }
    });
  </script>
</body>
</html>
