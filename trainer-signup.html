<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register as a trainer with Fit Track Pro">
  <title>Trainer Signup - Fit Track Pro</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="icon" href="./public/logo.png" type="image/png">

  <style>
    /* === Verification Styles === */
    .verify-row {
      display: flex;
      gap: var(--space-3);
      align-items: flex-end;
    }
    .verify-row .form-group { flex: 1; margin-bottom: 0; }
    .verify-btn {
      padding: 10px 16px;
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      border: none;
      border-radius: var(--radius-lg);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      height: 44px;
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .verify-btn.email-btn {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
    }
    .verify-btn.otp-btn {
      background: linear-gradient(135deg, #f59e0b, #f97316);
      color: white;
    }
    .verify-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .verify-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: var(--text-xs);
      font-weight: var(--font-semibold);
    }
    .verify-badge.verified {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .verify-badge.pending {
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .otp-input-group {
      display: none;
      margin-top: var(--space-3);
      animation: fadeInUp 0.3s ease;
    }
    .otp-input-group.show { display: block; }
    .otp-input-row {
      display: flex;
      gap: var(--space-3);
      align-items: flex-end;
    }
    .otp-input-row .form-group { flex: 1; margin-bottom: 0; }
    .otp-timer {
      font-size: var(--text-xs);
      color: var(--text-muted);
      margin-top: var(--space-2);
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 480px) {
      .verify-row { flex-direction: column; align-items: stretch; }
      .verify-btn { width: 100%; justify-content: center; }
      .otp-input-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-container" style="max-width: 500px;">
      <div class="auth-card">
        <!-- Back Button -->
        <a href="./role.html" style="display: inline-flex; align-items: center; gap: var(--space-2); color: var(--text-muted); margin-bottom: var(--space-4); font-size: var(--text-sm);">
          <i class="fa-solid fa-arrow-left"></i>
          Back to role selection
        </a>

        <!-- Logo -->
        <div class="auth-logo">
          <img src="./public/logo.png" alt="Fit Track Pro Logo">
          <h1>Become a Trainer</h1>
          <p>Join our network of fitness professionals</p>
        </div>

        <!-- Signup Form -->
        <form id="signupForm" class="auth-form">
          <div class="form-group">
            <label for="trainerName" class="form-label">Full Name *</label>
            <input 
              type="text" 
              id="trainerName" 
              name="trainerName" 
              class="form-input" 
              placeholder="Enter your full name"
              required
            >
          </div>

          <div class="form-group">
            <label for="gym" class="form-label">Select Gym *</label>
            <select id="gym" name="gym" class="form-input" required>
              <option value="">Loading gyms...</option>
            </select>
          </div>

          <div class="form-group">
            <label for="specialization" class="form-label">Specialization *</label>
            <select id="specialization" name="specialization" class="form-input" required>
              <option value="">Select your specialization</option>
              <option value="Weight Training">Weight Training</option>
              <option value="Cardio & HIIT">Cardio & HIIT</option>
              <option value="Yoga & Flexibility">Yoga & Flexibility</option>
              <option value="CrossFit">CrossFit</option>
              <option value="Martial Arts">Martial Arts</option>
              <option value="Nutrition & Diet">Nutrition & Diet</option>
              <option value="Sports Training">Sports Training</option>
              <option value="General Fitness">General Fitness</option>
            </select>
          </div>

          <div class="form-group">
            <label for="experience" class="form-label">Years of Experience *</label>
            <input 
              type="number" 
              id="experience" 
              name="experience" 
              class="form-input" 
              placeholder="e.g., 5"
              min="0"
              max="50"
              required
            >
          </div>

          <!-- Email with Verification -->
          <div class="form-group">
            <label for="email" class="form-label">
              Email Address * 
              <span class="verify-badge pending" id="emailBadge" style="display:none;">
                <i class="fa-solid fa-clock"></i> Not verified
              </span>
            </label>
            <div class="verify-row">
              <div class="form-group">
                <input 
                  type="email" 
                  id="email" 
                  name="email" 
                  class="form-input" 
                  placeholder="Enter your email"
                  required
                  autocomplete="email"
                >
              </div>
              <button type="button" class="verify-btn email-btn" id="verifyEmailBtn">
                <i class="fa-solid fa-envelope"></i> Verify
              </button>
            </div>
            <small id="emailHelp" style="color: var(--text-muted); font-size: var(--text-xs);">
              A verification link will be sent to your email
            </small>
          </div>

          <!-- Phone with OTP -->
          <div class="form-group">
            <label for="phone" class="form-label">
              Phone Number * 
              <span class="verify-badge pending" id="phoneBadge" style="display:none;">
                <i class="fa-solid fa-clock"></i> Not verified
              </span>
            </label>
            <div class="verify-row">
              <div class="form-group">
                <input 
                  type="tel" 
                  id="phone" 
                  name="phone" 
                  class="form-input" 
                  placeholder="Enter 10-digit phone number"
                  pattern="[0-9]{10}"
                  required
                >
              </div>
              <button type="button" class="verify-btn otp-btn" id="sendOtpBtn" disabled>
                <i class="fa-solid fa-message"></i> Send OTP
              </button>
            </div>
            <div class="otp-input-group" id="otpGroup">
              <div class="otp-input-row">
                <div class="form-group">
                  <input 
                    type="text" 
                    id="otpInput" 
                    class="form-input" 
                    placeholder="Enter 6-digit OTP"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    style="letter-spacing: 4px; font-weight: 700; text-align: center;"
                  >
                </div>
                <button type="button" class="verify-btn otp-btn" id="verifyOtpBtn">
                  <i class="fa-solid fa-check"></i> Verify
                </button>
              </div>
              <div class="otp-timer" id="otpTimer">OTP sent to your email. Expires in 5:00</div>
            </div>
            <small id="phoneHelp" style="color: var(--text-muted); font-size: var(--text-xs);">
              Verify email first, then OTP will be sent to your email
            </small>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password *</label>
            <div class="password-wrapper">
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-input" 
                placeholder="Create a strong password"
                minlength="6"
                required
                autocomplete="new-password"
              >
              <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                <i class="fa-solid fa-eye" id="eyeIcon"></i>
              </button>
            </div>
            <small style="color: var(--text-muted); font-size: var(--text-xs);">Minimum 6 characters</small>
          </div>

          <div class="form-group">
            <label for="confirmPassword" class="form-label">Confirm Password *</label>
            <div class="password-wrapper">
              <input 
                type="password" 
                id="confirmPassword" 
                name="confirmPassword" 
                class="form-input" 
                placeholder="Confirm your password"
                minlength="6"
                required
                autocomplete="new-password"
              >
              <button type="button" class="password-toggle" id="toggleConfirmPassword" aria-label="Toggle password visibility">
                <i class="fa-solid fa-eye" id="eyeIconConfirm"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-check">
              <input type="checkbox" name="terms" required>
              <span>I agree to the <a href="#" style="color: var(--primary-400);">Terms of Service</a> and <a href="#" style="color: var(--primary-400);">Privacy Policy</a></span>
            </label>
          </div>

          <button type="submit" id="signupBtn" class="btn btn-primary">
            <span id="btnText">Verify Email & Phone First</span>
          </button>
        </form>

        <!-- Footer -->
        <div class="auth-footer">
          <p>Already have an account? <a href="./login.html">Sign in</a></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module">
    import { auth, database } from './src/config/firebase.js';
    import { createUserWithEmailAndPassword, sendEmailVerification, signOut } from 'firebase/auth';
    import { ref, set, get } from 'firebase/database';
    import { showToast, showSuccess, showError, showWarning, showInfo } from './src/components/toast.js';
    import { setButtonLoading, isValidEmail, isValidPhone } from './src/js/utils.js';
    import { generateOTP, verifyOTP } from './src/js/otp-utils.js';

    // Load gyms
    const gymSelect = document.getElementById('gym');
    const urlParams = new URLSearchParams(window.location.search);
    const preselectedGymId = urlParams.get('gym');

    async function loadGyms() {
      try {
        const ownersSnap = await get(ref(database, 'owners'));
        if (!ownersSnap.exists()) {
          gymSelect.innerHTML = '<option value="">No gyms available</option>';
          return;
        }
        const options = ['<option value="">Select your gym</option>'];
        ownersSnap.forEach(owner => {
          const data = owner.val();
          const selected = owner.key === preselectedGymId ? 'selected' : '';
          options.push(`<option value="${owner.key}" ${selected}>${data.gymName}${data.city ? ' - ' + data.city : ''}</option>`);
        });
        gymSelect.innerHTML = options.join('');
      } catch (error) {
        console.error('Error loading gyms:', error);
        gymSelect.innerHTML = '<option value="">Error loading gyms</option>';
      }
    }
    loadGyms();

    // DOM Elements
    const signupForm = document.getElementById('signupForm');
    const signupBtn = document.getElementById('signupBtn');
    const btnText = document.getElementById('btnText');
    const togglePassword = document.getElementById('togglePassword');
    const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeIconConfirm = document.getElementById('eyeIconConfirm');

    // Verification DOM
    const verifyEmailBtn = document.getElementById('verifyEmailBtn');
    const emailBadge = document.getElementById('emailBadge');
    const sendOtpBtn = document.getElementById('sendOtpBtn');
    const phoneBadge = document.getElementById('phoneBadge');
    const otpGroup = document.getElementById('otpGroup');
    const otpInput = document.getElementById('otpInput');
    const verifyOtpBtn = document.getElementById('verifyOtpBtn');
    const otpTimer = document.getElementById('otpTimer');
    const emailInput = document.getElementById('email');
    const phoneInput = document.getElementById('phone');

    // State
    let emailVerified = false;
    let phoneVerified = false;
    let tempUser = null;
    let otpTimerInterval = null;

    // Disable submit initially
    signupBtn.disabled = true;
    signupBtn.style.opacity = '0.5';

    // Password toggle
    function setupPasswordToggle(toggle, input, icon) {
      toggle.addEventListener('click', () => {
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        icon.classList.toggle('fa-eye', !isPassword);
        icon.classList.toggle('fa-eye-slash', isPassword);
      });
    }
    setupPasswordToggle(togglePassword, passwordInput, eyeIcon);
    setupPasswordToggle(toggleConfirmPassword, confirmPasswordInput, eyeIconConfirm);

    // ===== EMAIL VERIFICATION =====
    verifyEmailBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !isValidEmail(email)) {
        showError('Please enter a valid email address first');
        return;
      }
      if (!password || password.length < 6) {
        showError('Please enter a password (min 6 characters) before verifying email');
        return;
      }

      verifyEmailBtn.disabled = true;
      verifyEmailBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        tempUser = userCredential.user;
        await sendEmailVerification(tempUser);

        showSuccess('Verification email sent! Check your inbox and click the link.');
        emailBadge.style.display = 'inline-flex';
        emailBadge.innerHTML = '<i class="fa-solid fa-clock"></i> Check inbox';
        emailBadge.className = 'verify-badge pending';
        verifyEmailBtn.innerHTML = '<i class="fa-solid fa-rotate"></i> Check Status';
        verifyEmailBtn.disabled = false;

        emailInput.readOnly = true;
        passwordInput.readOnly = true;
        confirmPasswordInput.readOnly = true;

        startEmailVerificationPolling();
      } catch (error) {
        console.error('Email verification error:', error);
        verifyEmailBtn.disabled = false;
        verifyEmailBtn.innerHTML = '<i class="fa-solid fa-envelope"></i> Verify';
        if (error.code === 'auth/email-already-in-use') {
          showError('This email is already registered. Please sign in instead.');
        } else {
          showError(error.message || 'Failed to send verification email');
        }
      }
    });

    function startEmailVerificationPolling() {
      const pollInterval = setInterval(async () => {
        if (tempUser) {
          await tempUser.reload();
          if (tempUser.emailVerified) {
            clearInterval(pollInterval);
            markEmailVerified();
          }
        }
      }, 3000);

      verifyEmailBtn.onclick = async () => {
        if (tempUser) {
          await tempUser.reload();
          if (tempUser.emailVerified) {
            clearInterval(pollInterval);
            markEmailVerified();
          } else {
            showInfo('Email not yet verified. Check your inbox and click the link.');
          }
        }
      };
    }

    function markEmailVerified() {
      emailVerified = true;
      emailBadge.innerHTML = '<i class="fa-solid fa-circle-check"></i> Verified';
      emailBadge.className = 'verify-badge verified';
      verifyEmailBtn.style.display = 'none';
      document.getElementById('emailHelp').textContent = 'Email verified successfully!';
      document.getElementById('emailHelp').style.color = '#22c55e';
      sendOtpBtn.disabled = false;
      document.getElementById('phoneHelp').textContent = 'Now verify your phone number';
      showSuccess('Email verified! Now verify your phone.');
      updateSubmitButton();
    }

    // ===== PHONE OTP =====
    sendOtpBtn.addEventListener('click', async () => {
      const phone = phoneInput.value.trim();
      const email = emailInput.value.trim();
      if (!isValidPhone(phone)) { showError('Please enter a valid 10-digit phone number'); return; }
      if (!emailVerified) { showError('Please verify your email first'); return; }

      sendOtpBtn.disabled = true;
      sendOtpBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

      try {
        const result = await generateOTP(phone, email);

        showSuccess(`OTP for phone verification: ${result.otp}`);
        showInfo('Enter this OTP below to verify your phone number');
        otpGroup.classList.add('show');
        phoneBadge.style.display = 'inline-flex';
        phoneInput.readOnly = true;
        startOtpTimer(300);
        sendOtpBtn.innerHTML = '<i class="fa-solid fa-rotate"></i> Resend';
        sendOtpBtn.disabled = false;
      } catch (error) {
        showError(error.message || 'Failed to generate OTP');
        sendOtpBtn.disabled = false;
        sendOtpBtn.innerHTML = '<i class="fa-solid fa-message"></i> Send OTP';
      }
    });

    verifyOtpBtn.addEventListener('click', async () => {
      const otp = otpInput.value.trim();
      const phone = phoneInput.value.trim();
      if (!otp || otp.length !== 6) { showError('Please enter the 6-digit OTP'); return; }

      verifyOtpBtn.disabled = true;
      verifyOtpBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

      try {
        const result = await verifyOTP(phone, otp);
        if (!result.success) throw new Error(result.error || 'Invalid OTP');

        phoneVerified = true;
        phoneBadge.innerHTML = '<i class="fa-solid fa-circle-check"></i> Verified';
        phoneBadge.className = 'verify-badge verified';
        otpGroup.classList.remove('show');
        sendOtpBtn.style.display = 'none';
        if (otpTimerInterval) clearInterval(otpTimerInterval);
        document.getElementById('phoneHelp').textContent = 'Phone verified successfully!';
        document.getElementById('phoneHelp').style.color = '#22c55e';
        showSuccess('Phone verified! You can now submit the form.');
        updateSubmitButton();
      } catch (error) {
        showError(error.message || 'Invalid OTP. Please try again.');
        verifyOtpBtn.disabled = false;
        verifyOtpBtn.innerHTML = '<i class="fa-solid fa-check"></i> Verify';
      }
    });

    function startOtpTimer(seconds) {
      if (otpTimerInterval) clearInterval(otpTimerInterval);
      let remaining = seconds;
      otpTimer.textContent = `OTP expires in ${formatTime(remaining)}`;
      otpTimerInterval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(otpTimerInterval);
          otpTimer.textContent = 'OTP expired. Click Resend to get a new one.';
          otpTimer.style.color = '#ef4444';
        } else {
          otpTimer.textContent = `OTP expires in ${formatTime(remaining)}`;
        }
      }, 1000);
    }

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function updateSubmitButton() {
      if (emailVerified && phoneVerified) {
        signupBtn.disabled = false;
        signupBtn.style.opacity = '1';
        btnText.textContent = 'Create Account';
      }
    }

    // Handle signup
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!emailVerified || !phoneVerified) {
        showWarning('Please verify both email and phone before submitting');
        return;
      }

      const trainerName = document.getElementById('trainerName').value.trim();
      const selectedGym = document.getElementById('gym').value;
      const specialization = document.getElementById('specialization').value;
      const experience = document.getElementById('experience').value;
      const phone = phoneInput.value.trim();
      const email = emailInput.value.trim();

      if (!trainerName || !selectedGym || !specialization || !experience || !phone || !email) {
        showWarning('Please fill in all required fields');
        return;
      }

      setButtonLoading(signupBtn, true, 'Sending request...');
      btnText.textContent = 'Sending request...';

      try {
        const uid = tempUser.uid;

        await set(ref(database, `pending_requests/${uid}`), {
          userId: uid,
          gymId: selectedGym,
          type: 'trainer',
          name: trainerName,
          email: email,
          phone: phone,
          emailVerified: true,
          phoneVerified: true,
          status: 'pending',
          createdAt: new Date().toISOString(),
          profileData: {
            specialization: specialization,
            experience: parseInt(experience)
          }
        });

        showSuccess('Request sent! Waiting for gym owner approval.');
        await signOut(auth);

        setTimeout(() => {
          window.location.href = './login.html?pending=true';
        }, 2000);

      } catch (error) {
        console.error('Signup error:', error);
        showError('Registration failed. Please try again.');
        setButtonLoading(signupBtn, false);
        btnText.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
